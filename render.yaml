services:
  - type: web
    name: charnamrit-staff-control
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    preDeployCommand: node scripts/migrate.js && node scripts/init-admin.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_DAYS
        value: "7"
      - key: DATABASE_URL
        fromDatabase:
          name: charnamrit-staff-db
          property: connectionString
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: charnamrit-staff-db
    plan: free
    region: singapore
    databaseName: staffapp
    user: staffapp
    postgresMajorVersion: "17"
    ipAllowList: []
