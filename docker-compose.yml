services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: staffapp
      POSTGRES_USER: staffapp
      POSTGRES_PASSWORD: CHANGE_ME_DB_PASSWORD
    volumes:
      - staffapp_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staffapp -d staffapp"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000:3000"

volumes:
  staffapp_pgdata:
